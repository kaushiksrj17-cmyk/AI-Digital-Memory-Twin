version: '3.8'

# ==============================================================================
# ECHO — AI Digital Memory Twin (Docker Compose)
# Research Title: Evidence-Grounded, Privacy-Preserving Multimodal AI
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: echo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_ROOT=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/echo_memory_db
      - VECTOR_DATABASE_URL=qdrant://qdrant:6333/echo_memories
      - STORAGE_ROOT=/app/storage/local
    volumes:
      - ./storage/local:/app/storage/local
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: echo-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    container_name: echo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: echo_memory_db
    ports:
      - "5432:5432"
    volumes:
      - echo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: echo-vector-db
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - echo_vector_data:/qdrant/storage

volumes:
  echo_postgres_data:
  echo_vector_data:
